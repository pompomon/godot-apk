name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/android-apk.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail

          "$sdkmanager" \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36"

      - name: Install Godot and export templates
        shell: bash
        # Keep toolchain pins and checksums aligned with android-apk.yml.
        env:
          GODOT_VERSION: "4.7.2"
          GODOT_RELEASE: stable
          GODOT_EDITOR_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
          GODOT_TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_RELEASE}"
          install_dir="$(mktemp -d "$RUNNER_TEMP/copilot-godot.XXXXXX")"
          trap 'rm -rf "$install_dir"' EXIT
          editor_archive="$install_dir/godot.zip"
          templates_archive="$install_dir/export-templates.tpz"

          curl --fail --location --retry 3 \
            --output "$editor_archive" \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output "$templates_archive" \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_export_templates.tpz"

          echo "${GODOT_EDITOR_SHA512}  ${editor_archive}" | sha512sum --check
          echo "${GODOT_TEMPLATES_SHA512}  ${templates_archive}" | sha512sum --check

          mkdir -p "$install_dir/godot" "$install_dir/export-templates"
          unzip -q "$editor_archive" -d "$install_dir/godot"
          unzip -q "$templates_archive" -d "$install_dir/export-templates"
          sudo install -m 0755 \
            "$install_dir/godot/Godot_v${release}_linux.x86_64" \
            /usr/local/bin/godot

          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$templates_dir"
          cp -R "$install_dir/export-templates/templates/." "$templates_dir/"
          version="$(godot --headless --version)"
          [[ "$version" == "${GODOT_VERSION}.${GODOT_RELEASE}."* ]]
          test -s "$templates_dir/android_debug.apk"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Verify toolchain readiness
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --version
          "$JAVA_HOME/bin/java" -version
          javac_version="$("$JAVA_HOME/bin/javac" -version)"
          [[ "$javac_version" == "javac 17."* ]]
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -s "$HOME/.config/godot/editor_settings-4.tres"
          keytool -list \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" >/dev/null
          {
            echo "### Copilot toolchain ready"
            echo "Godot editor/templates, Java 17, Android SDK and debug signing verified."
            echo "This is environment preparation, not project test/export or device acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
